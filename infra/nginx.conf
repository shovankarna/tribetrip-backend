events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Upstream definitions for services
    upstream user_service {
        server user-service:8081;
    }

    upstream trip_service {
        server trip-service:8082;
    }

    upstream itinerary_service {
        server itinerary-service:8083;
    }

    upstream keycloak {
        server keycloak:8080;
    }

    upstream frontend {
        server host.docker.internal:5173;
    }

    upstream expense_service {
        server expense-service:8084;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend (Vite Dev Server)
        location / {
            proxy_pass http://frontend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # Keycloak
        location /auth/ {
            proxy_pass http://keycloak/auth/; # Keycloak 16- path, check newer versions use /realms
            # For Quay Keycloak 24, path is usually / or /realms...
            # We'll proxy everything relevant or just let FE talk to Keycloak directly? 
            # Usually FE talks to Keycloak directly. 
            # But if we want to proxy:
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # User Service API
        location /api/user {
            proxy_pass http://user_service;
            proxy_set_header Host $host;
        }
        
        # Trip Service API
        location /api/trips {
            proxy_pass http://trip_service;
            proxy_set_header Host $host;
        }

        # Itinerary Service API
        location /api/itineraries {
            proxy_pass http://itinerary_service;
            proxy_set_header Host $host;
        }

        # Expense Service API
        location /api/expenses {
            proxy_pass http://expense_service;
            proxy_set_header Host $host;
        }
    }
}

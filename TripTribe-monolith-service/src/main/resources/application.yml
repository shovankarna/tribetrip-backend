server:
  port: 8090

spring:
  application:
    name: TripTribe-monolith-service
  
  datasource:
    url: jdbc:postgresql://localhost:5432/triptribe_monolith
    username: tripuser
    password: tripsecret
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY}
    model: ${GEMINI_MODEL}

logging:
  level:
    com.triptribe: DEBUG

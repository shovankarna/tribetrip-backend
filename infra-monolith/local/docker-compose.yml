services:

  postgres:
    image: postgres:15
    container_name: trip_monolith_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: triptribe_monolith
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - trip_monolith_pg_data:/var/lib/postgresql/data
      - ../postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - trip-monolith-network

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: trip_monolith_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    volumes:
      - ../../keycloak/realm-export:/opt/keycloak/data/import
    networks:
      - trip-monolith-network

  nginx:
    image: nginx:alpine
    container_name: trip_monolith_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - keycloak
      - trip-monolith-service
    networks:
      - trip-monolith-network

  trip-monolith-service:
    build:
      context: ../../TripTribe-monolith-service
      dockerfile: Dockerfile
    container_name: trip_monolith_service
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/triptribe_monolith
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL}
    ports:
      - "8090:8090"
    depends_on:
      - postgres
      - keycloak
    networks:
      - trip-monolith-network

volumes:
  trip_monolith_pg_data:

networks:
  trip-monolith-network:
    driver: bridge

name: Deploy Server

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - 'infra/server/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy files to server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "infra/server/docker-compose.yml,infra/postgres/init.sql,infra/nginx.conf"
          target: "~/triptribe"

      - name: Deploy
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/triptribe/infra/server
            # Assume .env is already set on server or added in secrets step (simplified for now)
            docker-compose pull
            docker-compose up -d

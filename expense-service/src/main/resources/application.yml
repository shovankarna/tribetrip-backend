server:
  port: 8084

spring:
  application:
    name: expense-service
  datasource:
    url: jdbc:postgresql://postgres:5432/expensedb
    username: ${POSTGRES_USER:tripuser}
    password: ${POSTGRES_PASSWORD:password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

logging:
  level:
    com.triptribe.expenseservice: DEBUG

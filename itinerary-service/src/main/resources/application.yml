server:
  port: 8083

spring:
  application:
    name: itinerary-service
  
  # Application Specific Configuration
  config:
    trip-service:
      url: ${TRIP_SERVICE_URL:http://trip-service:8082}
  datasource:
    url: jdbc:postgresql://localhost:5432/itinerarydb
    username: tripuser
    password: tripsecret
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# Logging
logging:
  level:
    com.triptribe: DEBUG

# Gemini AI Configuration
gemini:
  api:
    key: ${GEMINI_API_KEY}
